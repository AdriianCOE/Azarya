 gw_tank_equipment:0 "Light Tank '30"
 gw_tank_equipment_short:0 "L. Tank '30"
 gw_tank_equipment_desc:0 "Tanks in the Great War were developed separately and simultaneously by the United Kingdom and France to break the deadlock of trench warfare on the Western Front. The British adopted the name Tank during the early stages of their development as a security measure to conceal their purpose. Early tanks were armed with machine guns and small cannons, moved slowly, and were armored only enough to stop small arms fire."
 light_tank_equipment:0 "Light Tank"
 light_tank_equipment_desc:0 "Light tanks are small, agile ones that can scout and fight lightly armored opponents."
 light_tank_equipment_1:0 "Light Tank '34"
 light_tank_equipment_1_short:0 "L. Tank '34"
 light_tank_equipment_1_desc:0 "Light tanks are small, agile ones that can scout and fight lightly armored opponents."
 light_tank_equipment_2:0 "Light Tank '24"
 light_tank_equipment_2_short:0 "L. Tank '24"
 light_tank_equipment_2_desc:0 "Light tanks are small, agile ones that can scout and fight lightly armored opponents."
 light_tank_equipment_3:0 "Light Tank '29"
 light_tank_equipment_3_short:0 "L. Tank '29"
 light_tank_equipment_3_desc:0 "Light tanks are small, agile ones that can scout and fight lightly armored opponents."
 light_tank_equipment_x:0 "Light Tank '33"
 light_tank_equipment_x_short:0 "L. Tank '33"
 light_tank_equipment_x_desc:0 "Although they cannot take much of a beating, these tanks are light, designed to move fast and with great force."
 light_tank_equipment_x_2:0 "Light Tank '37"
 light_tank_equipment_x_2_short:0 "L. Tank '37"
 light_tank_equipment_x_2_desc:0 "Although they cannot take much of a beating, these tanks are light, designed to move fast and with great force."

