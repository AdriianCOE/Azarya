l_english:
#THK
THK_Defeated_Army:0 "Defeated Army"
THK_Defeated_Army_desc:0 "After the humiliating defeat in the border dispute, Thiryn's army is demoralized and disorganized. Incompetent officers and poorly equipped troops have turned the kingdom's military force into a mere shadow of its former self, jeopardizing national security."

THK_Corrupt_Queen:0 "The Corrupt Queen"
THK_Corrupt_Queen_desc:0 "For decades, the court of Thiryn has been synonymous with privilege, patronage, and quiet corruption. The crown's grip on power remains firm, but its legitimacy erodes a little more with each scandal that reaches the streets."

Great_Earthquake:0 "The Great Earthquake"
Great_Earthquake_desc:0 "At the end of 1922, a devastating earthquake shook the entire peninsula, destroying cities, collapsing infrastructure, and leaving thousands homeless. The aftermath of this catastrophe still affects Thiryn, as rebuilding efforts struggle against political instability and economic turmoil."

THK_Revanchist_Movement:0 "The Revanchist Movement"
THK_Revanchist_Movement_desc:0 "Veterans, dispossessed landowners, and refugees from Doia, Haifa, and Mominches have found common cause in a single demand: the return of what was lost. Their voice grows louder in every barracks and every tavern, and no government can safely ignore it."

THK_War_Refugees:0 "Refugees of the Lost Provinces"
THK_War_Refugees_desc:0 "Thousands who once called Doia, Haifa, and Mominches home now crowd the roads and outskirts of Thiryn's cities, dependent on a state that can barely feed itself. Their presence strains every ministry, yet their hands are needed in field and factory alike."

THK_Gydian_Patronage:0 "Gydian Patronage"
THK_Gydian_Patronage_desc:0 "Gydian credit has steadied the treasury, and Gydian advisors now sit in offices that once answered only to the Crown. Thiryn's finances are safer for it — but every loan carries a price yet to be named."

THK_Self_Reliance:0 "The Self-Reliance Doctrine"
THK_Self_Reliance_desc:0 "Rejecting Gydian patronage was a matter of pride as much as policy. Without foreign capital, reconstruction moves slower — but no foreign minister can claim a vote in Eldoria's council chambers."

THK_War_Preparations:0 "Preparing the Claim"
THK_War_Preparations_desc:0 "Maps of Doia, Haifa, and Mominches now hang in the war ministry beside maps of Thiryn itself. Stockpiles grow, reservists drill on weekends, and the army waits for the government to decide when — not whether — the claim will be pressed."

#AEI
AEI_TheBigTree:0 "The Tree"
AEI_TheBigTree_desc:0 "The Big Tree unified all of us..."
#SIT
SIT_Victorium_Legacy:0 "Victorium Legacy"
SIT_Victorium_Legacy_desc:0 "The Sithius Empire, once the grand Victorium, carries a legacy of maritime prowess and imperial glory. Despite the grandeur, internal divisions and memories of past conflicts still haunt the empire, leading to a mixed stability and a focus on naval strength."

SIT_Navy_Legacy:0 "Navy Legacy"
SIT_Navy_Legacy_desc:0 "The Sithius Empire's history is rich with naval achievements, from conquering coastal cities to dominating the seas. This legacy has left the empire with a highly skilled and efficient navy, but internal stability remains a challenge."

SIT_Unstable_Government:0 "Unstable Government"
SIT_Unstable_Government_desc:0 "The Sithius Empire faces significant internal challenges, with political instability and economic difficulties. The government's struggle to maintain control has led to decreased stability and war support, reflecting the turbulent state of the nation."

#CZL
CZL_Fear_of_the_population:0 "Legacy of Fear"
CZL_Fear_of_the_population_desc:0 "Decades of brutal oppression in the northern provinces, especially over the Alarican population, have left deep scars. The memories of exile, confiscation, and violence still haunt the people, creating an atmosphere of mistrust and unrest throughout the nation."

CZL_Autoritarismo:0 "Authoritarian Rule"
CZL_Autoritarismo_desc:0 "The Czardom of Lesc has long relied on the might of its army and the iron grip of the ruling Vorenkov dynasty to maintain order. While effective in suppressing dissent, this rigid control fuels resistance and stifles political development."

CZL_Monetary_retention:0 "Seized Assets"
CZL_Monetary_retention_desc:0 "In an effort to secure absolute control, the Czardom has enacted harsh economic policies—seizing private property, hoarding national wealth, and taxing the poor heavily. The economy suffers, and political unrest continues to fester under the weight of inequality."

LSC_northern_military_rule:0 "Military Administration of the Alarican Provinces"
LSC_northern_military_rule_desc:0 "The north was never governed — it was garrisoned. Since the conquest, the Alarican provinces have answered to army commandants rather than magistrates, their levies and grain requisitioned under standing orders. It keeps the roads open and the mines running, but every year of martial law is a year the north does not forget."

LSC_gathering_storm:0 "The Uncured Fracture"
LSC_gathering_storm_desc:0 "The old wound between the wealthy south and the occupied north has never closed, and now the Czar's failing health threatens to reopen it at the worst possible moment. Ministers speak in careful half-sentences; the army watches the palace; the ledgers of the great southern houses stay open later than usual."

LSC_gydian_doctrine:0 "Gydian Staff Manuals"
LSC_gydian_doctrine_desc:0 "Reprinted and distributed through the officer corps, the borrowed Gydian field manuals bring a harder, more methodical edge to Lescian drill and staff planning — a first, cautious step toward a modernized army, taken without yet inviting Gydian advisors into the Czar's own councils."

LSC_southern_contracts:0 "Southern Contracts and Credit"
LSC_southern_contracts_desc:0 "State contracts, easy credit, and a great deal of goodwill flow from the counting houses of the south — goodwill that is never extended without expecting a say in how it is spent. Construction moves faster under this arrangement; the Crown's independence moves a little slower."

LSC_kael_officer_network:0 "Kael's Officer Network"
LSC_kael_officer_network_desc:0 "A quiet web of postings and promotions has put officers loyal to Kael in exactly the rooms where decisions get made. The chain of command runs smoother for it — and answers to more than one master."

LSC_kael_oligarch_support:0 "Backing of the Southern Houses"
LSC_kael_oligarch_support_desc:0 "The great industrial families back Kael's claim with contracts, credit, and favorable press — an alliance that keeps the arms factories running, at the price of the direction they run in."

LSC_selene_palace_network:0 "Selene's Palace Network"
LSC_selene_palace_network_desc:0 "Clerks, stewards, chamberlains and a discreet circle of guardsmen keep the machinery of the palace running smoothly — and keep Selene informed of everything that passes through it."

LSC_alvaro_partisan_networks:0 "Alarican Partisan Networks"
LSC_alvaro_partisan_networks_desc:0 "Messengers, veterans and organizers move between the valleys and the mill towns, building something the administration cannot see clearly enough to dismantle. It unsettles the state more than it comforts anyone."

LSC_underground_press:0 "The Underground Press"
LSC_underground_press_desc:0 "Hidden typesets and smuggled pamphlets carry word through the Alarican valleys faster than the administration can seize them. Every raid that fails to find the press only proves its point."
