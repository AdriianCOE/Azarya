 AZ_COUNTRY_BRIEFING_THK:0 "§YThe Kingdom of Thiryn§!\n\n§WRegime:§! Constitutional monarchy, house of Aurum - though after four centuries of misrule and a humiliating border defeat, that title means less every day.\n§WPower center:§! Queen Elara Lorenthia, presiding over a court that no longer fully trusts her and a public that trusts the crown even less.\n§WInternal situation:§! The army is defeated and demoralized, the treasury strained, and the old nobility increasingly convinced the monarchy itself may not survive the decade. Rival figures within the kingdom - generals, nobles, reformers - are watching for the first sign of weakness.\n§WImmediate goals:§! Rebuild the army's shattered pride, decide how much power the crown is willing to surrender to save itself, and answer the question the whole kingdom is asking - reform, or revolution.\n§WStrategic risks:§! A court that could turn on its own queen, a population radicalized by defeat, and a region still digging out from under the Great Earthquake's aftermath.\n\nFor over four centuries, wealth flowed to the crown and despair to the people; that arrangement is now visibly, publicly over. Thiryn in 1924 is Azarya's central drama - not because it is the strongest nation on the continent, but because everyone else is watching to see what an old order looks like when it finally breaks."

 AZ_COUNTRY_BRIEFING_CZL:0 "§YThe Czariado de Lesc§!\n\n§WRegime:§! An oligarchic czardom - the Czar rules, but real authority is shared uneasily with the noble houses that actually hold the provinces.\n§WPower center:§! Prince Lescote, whose grip on the throne is only as strong as the loyalty of lords who increasingly answer to their own interests first.\n§WInternal situation:§! Waves of civil unrest have swept the northern provinces, and the old promise of stability rings hollow. The nobility is fractured between those who want to crush the unrest outright and those who see reform as the only way to survive it.\n§WImmediate goals:§! Restore central authority over the north before it slips away entirely, and settle - one way or another - how far the Czar is willing to bend.\n§WStrategic risks:§! An oligarchy that could fracture into open civil war, and neighbors who would be glad to exploit a Czariado busy with itself.\n\nLesc was once a byword for stability in this part of the continent. That reputation is now a memory the court invokes more than it earns - the future of the Czariado will be decided by how it answers the provinces it has spent a generation neglecting."

 AZ_COUNTRY_BRIEFING_SLV:0 "§YNicollonia§!\n\n§WRegime:§! A liberal republic, still young enough that its institutions haven't been tested by a real crisis.\n§WPower center:§! Liana Moreau, a reform-minded leader more architect than politician, trying to build something durable out of a nation shaped by trade, colonization, and a hard-won independence.\n§WInternal situation:§! Prosperous and democratic by regional standards, but that prosperity has never been stress-tested against the kind of continental tension now rising on every border.\n§WImmediate goals:§! Prove that a young democracy can hold its footing while older, harder regimes around it start to crack.\n§WStrategic risks:§! Untested institutions, and a geopolitical neighborhood that isn't kind to nations still finding their feet.\n\nNicollonia's story so far is one of resilience - trade routes and coalitions built where empires once dictated terms. Whether that story continues past 1924 depends on whether its democracy is as sturdy as its trade ledgers."

 AZ_COUNTRY_BRIEFING_LUQ:0 "§YThe Federal State of Lucafis§!\n\n§WRegime:§! A federal republic built on compromise - mountain clans on one side of the table, coastal merchants on the other, and a government that exists mostly to keep both sides from walking away.\n§WPower center:§! The head of state, a hard-nosed negotiator more comfortable settling disputes between factions than commanding an army.\n§WInternal situation:§! Stable on paper. In practice, the compromise that built Lucafis is showing its age, and regional unrest threatens to prove that the appearance of unity was never the same thing as unity itself.\n§WImmediate goals:§! Hold the federation together through whatever continental turmoil is coming, without giving either the clans or the merchants a reason to break the agreement first.\n§WStrategic risks:§! A federation that could fracture along its oldest fault line the moment real pressure is applied.\n\nLucafis was built by people who preferred a working compromise to a righteous war. In the years ahead, they may not get to choose between the two."

 AZ_COUNTRY_BRIEFING_SLU:0 "§YThe Sollarium Empire§!\n\n§WRegime:§! Absolutism under an ancient ruling caste that claims a divine mandate and views itself as the last true light of civilization.\n§WPower center:§! The Shi of Rah, an absolute ruler whose word is, officially, beyond question.\n§WInternal situation:§! Rigid, tradition-bound, and obsessed with purity of both bloodline and doctrine - an empire that has not seriously questioned itself in generations, which is precisely the problem.\n§WImmediate goals:§! Preserve the old order at any cost, and make an example of the first sign of rebellion before it can spread.\n§WStrategic risks:§! An iron grip that has never been tested by a genuinely modern crisis, and a population that may not share the ruling caste's certainty that the old ways are worth dying for.\n\nSollarium does not see itself as one empire among many - it sees itself as the standard the rest of the continent has fallen short of. 1924 will test whether that self-image can survive contact with a world that has stopped agreeing with it."

 AZ_COUNTRY_BRIEFING_SVD:0 "§YThe Merchant Republic of Serenvioled§!\n\n§WRegime:§! A merchant republic in practice if not in name - trade guilds and coastal contracts hold more real sway than any general or minister.\n§WPower center:§! No single ruler; power is distributed across the great trading houses that built the republic's wealth and now quietly govern it.\n§WInternal situation:§! Rich, coastal, and studiously neutral - Serenvioled's wealth flows through silk-lined contracts rather than conquest, and the guilds intend to keep it that way for as long as possible.\n§WImmediate goals:§! Decide whether continued neutrality is still profitable as the continent militarizes around it, or whether it's time to spend some of that wealth shaping the outcome directly.\n§WStrategic risks:§! A republic built entirely on the assumption that trade is safer than war - an assumption every nation currently arming itself is about to test.\n\nSerenvioled has never needed to conquer anything; it simply bought influence instead. Whether that strategy still works in a continent sliding toward open conflict is the real question its merchant houses are quietly arguing over."

 AZ_COUNTRY_BRIEFING_SIT:0 "§YThe Sithius Imperium§!\n\n§WRegime:§! A constitutional monarchy built from the wreckage of the old Empire of Victorium - imperial in ambition, constrained on paper.\n§WPower center:§! Emperor Valerius IX, a ruthless administrator who has spent his reign trying to prove that Sithius is a continuation of Victorium's legacy, not its epilogue.\n§WInternal situation:§! Resilient but reduced - a maritime power ruling from Sìth on the island of Eòlas, keeping alive the memory of a sea it no longer fully commands.\n§WImmediate goals:§! Rebuild the fleet that once ruled the Victorium Sea, and decide how much of the ancient imperial legacy is worth reclaiming by force.\n§WStrategic risks:§! An empire whose self-image is still bigger than its navy, ruled by a man determined to close that gap one way or another.\n\nSithius keeps the old empire's spirit of conquest and progress alive mostly through memory and ceremony. Emperor Valerius IX intends 1924 to be the year that stops being enough."

 AZ_COUNTRY_BRIEFING_GENERIC:0 "This nation doesn't have a dedicated briefing in the Archive yet - the team is still writing these up, one nation at a time. In the meantime, that country's own history, national focus tree, and starting political situation (visible from the country selection screen) are the best guide to who they are and what they're facing in 1924."
