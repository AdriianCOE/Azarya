l_english:
 # Azarya: LSC_focus (Czariado de Lesc / CZL). Phase 1 cut only - the common
 # opening plus the first focus of each heir's route. See
 # docs/specs/lesc/LSC_Lesc_focus_tree_reformulada.txt for the full contract.

 LSC_an_empire_built_by_sword:0 "Distrust and Disloyalty"
 LSC_an_empire_built_by_sword_desc:0 "Viktor IV can no longer cross the throne room unassisted, and the court has stopped pretending not to notice. His three children already hold courts of their own — the general staff answers questions from Kael before they reach the Ministry of War; the great houses of the south quietly recalculate which heir their contracts should favor; and in the Alarican provinces, garrison commanders report unrest they no longer expect Aelia to take seriously. The Gydian advisors invited to modernize the army now advise rather more than they were asked to."
 LSC_an_empire_built_by_sword_tt:0 "The Czardom begins to reckon, openly, with a Crown too weak to hide its own fault lines: an ailing Czar, three rival heirs, an Army answering to itself, oligarchs hedging their bets, an occupied north, and a foreign power watching it all with interest."

 LSC_count_the_northern_dead:0 "Count the Northern Dead"
 LSC_count_the_northern_dead_desc:0 "A formal accounting of the cost of pacification — punitive columns, requisitioned grain, provinces held down rather than governed. The numbers are not meant for publication, but the court reads them all the same."
 LSC_count_the_northern_dead_tt:0 "Acknowledging the true cost of northern pacification buys the Czar's ministers some political capital, at the price of a little stability and a modest rise in Alarican unrest."

 LSC_open_southern_ledgers:0 "Open the Southern Ledgers"
 LSC_open_southern_ledgers_desc:0 "The great houses of the south have always kept two sets of books — one for the tax collector, one for themselves. Inviting the Crown to glimpse the second is a gesture of goodwill the oligarchs expect to be repaid."
 LSC_open_southern_ledgers_tt:0 "Southern industrialists open their books to the throne, strengthening the Crown's political hand while deepening oligarchic influence over the state."

 LSC_reprint_gydian_manuals:0 "Reprint the Gydian Manuals"
 LSC_reprint_gydian_manuals_desc:0 "Borrowed, translated, and quietly distributed through the officer corps: field manuals modeled on Gydian doctrine. A cautious first step toward modernizing the army, taken without yet inviting Gydian advisors into the Czar's own councils."

 LSC_viktors_last_council:0 "Viktor's Last Council"
 LSC_viktors_last_council_desc:0 "The Czar is old, and everyone in the room knows it, even if no one says so aloud. Viktor IV summons his ministers, his generals, and — pointedly — his three children, to settle what happens to Lesc when he no longer can."
 LSC_viktors_last_council_tt:0 "The succession is now openly acknowledged. The court, the army, and the provinces all begin positioning themselves for what comes next."

 LSC_kael_claims_the_sword:0 "Kael Claims the Sword"
 LSC_kael_claims_the_sword_desc:0 "Kael Vorenkov has spent his adult life among the general staff and the counting houses of the south. He does not intend to inherit a crumbling empire — he intends to forge a harder one."
 LSC_kael_claims_the_sword_tt:0 "Kael steps forward as the Crown's iron heir, courting the Army and the southern oligarchy. War support rises with the promise of resolve; stability pays the price of the growing confrontation."

 LSC_selene_the_marble_princess:0 "The Marble Princess"
 LSC_selene_the_marble_princess_desc:0 "Selene Vorenkov has never commanded a regiment or signed a ledger of her own, and she has never needed to — she knows exactly which door in the palace to knock on for anything she wants. She offers Lesc balance, not conquest."
 LSC_selene_the_marble_princess_tt:0 "Selene stakes her claim as the mediating heir, drawing on her own legitimacy among the court's older factions rather than the Army or the oligarchs alone."

 LSC_alvaro_speaks_for_the_north:0 "Alvaro Speaks for the North"
 LSC_alvaro_speaks_for_the_north_desc:0 "Alvaro Vorenkov was posted to the Alarican provinces as a young officer and came back a different man. He will not inherit the throne quietly while the north he came to know is governed at the point of a bayonet."
 LSC_alvaro_speaks_for_the_north_tt:0 "Alvaro breaks with his own house to speak for the Alarican provinces, hardening revolutionary sentiment in the north at the cost of the Crown's stability."

 # --- Phase 3: second stage of the three heir routes ---

 LSC_kael_court_the_general_staff:0 "Court the General Staff"
 LSC_kael_court_the_general_staff_desc:0 "Dinners, postings and quiet favors — Kael spends as much time in the officers' mess as he does in the palace, and the general staff has started to notice which Vorenkov actually shows up."

 LSC_kael_bind_the_oligarchs:0 "Bind the Oligarchs to His Cause"
 LSC_kael_bind_the_oligarchs_desc:0 "The southern houses have financed every Czar of Lesc since the conquest; Kael simply proposes they finance the next one a little more directly, and in exchange for rather more say than they have grown used to."

 LSC_kael_black_banner_league:0 "The Black Banner League"
 LSC_kael_black_banner_league_desc:0 "Veterans' clubs, patriotic societies and a great many young men with nowhere else to put their energy are drawn together under a single black banner and a single, unmistakable message: order, strength, and Kael Vorenkov."

 LSC_kael_frame_alvaro:0 "Frame Alvaro"
 LSC_kael_frame_alvaro_desc:0 "A dossier is assembled, page by page, out of half-truths, selective quotation and a few documents that were never meant to leave a filing cabinet. By the time it reaches Viktor's desk, it reads like a confession."

 LSC_kael_lock_the_capital:0 "Lock Down the Capital"
 LSC_kael_lock_the_capital_desc:0 "Loyal regiments quietly take up positions around Aelia's ministries, barracks and rail junctions. Nothing is announced. Nothing needs to be."

 LSC_selene_salon_of_whispers:0 "The Salon of Whispers"
 LSC_selene_salon_of_whispers_desc:0 "Selene's evenings have become the place where the court actually conducts its business — over cards and wine, long after the formal councils have adjourned and said nothing of substance."

 LSC_selene_win_the_palace_guard:0 "Win the Palace Guard"
 LSC_selene_win_the_palace_guard_desc:0 "The men who stand watch over the throne room rarely see their own loyalty courted directly. Selene changes that, one quiet conversation at a time."

 LSC_selene_marble_network:0 "The Marble Network"
 LSC_selene_marble_network_desc:0 "Stewards, clerks, guardsmen and a widening circle of minor courtiers now answer, in practice, to Selene before anyone else. Viktor is beginning to notice how much of the palace runs through his daughter's hands."

 LSC_selene_offer_the_white_ribbon:0 "Offer the White Ribbon"
 LSC_selene_offer_the_white_ribbon_desc:0 "A gesture of clemency, carefully staged: released prisoners, a lifted curfew here and there, a public acknowledgment that the north has grievances worth naming. It costs the Crown little and buys more goodwill than a garrison ever could."

 LSC_selene_break_the_extremes:0 "Break the Extremes"
 LSC_selene_break_the_extremes_desc:0 "Selene turns her network against both edges of the crisis at once — the oligarchs who would bleed the north dry and the radicals who would burn the south to the ground — and stakes her claim on being the only Vorenkov not beholden to either."

 LSC_alvaro_northern_cells:0 "Organize the Northern Cells"
 LSC_alvaro_northern_cells_desc:0 "Messengers move between mill towns and mountain villages, stitching together what used to be isolated pockets of resentment into something that can actually coordinate."

 LSC_alvaro_workers_committees:0 "Workers' Committees"
 LSC_alvaro_workers_committees_desc:0 "In the mines and foundries of the north, committees form where union halls were never permitted — electing their own delegates, keeping their own accounts, and answering to no southern foreman."

 LSC_alvaro_press_in_the_valleys:0 "A Press in the Valleys"
 LSC_alvaro_press_in_the_valleys_desc:0 "A hand-cranked press, hidden in a mill basement, begins turning out pamphlets faster than the gendarmerie can confiscate them. Every confiscated batch just proves the last one's point."

 LSC_alvaro_arm_the_valleys:0 "Arm the Valleys"
 LSC_alvaro_arm_the_valleys_desc:0 "Rifles that were never quite accounted for, powder that never quite matched the requisition ledgers — the valleys quietly stop being as disarmed as the garrison reports claim."

 LSC_alvaro_demand_autonomy:0 "Demand Autonomy for North Alaric"
 LSC_alvaro_demand_autonomy_desc:0 "Alvaro puts it to his father in writing, formally, for the first time: an end to military rule in the Alarican provinces, real political representation, and regional control over conscription and resources. It is not a request."
 LSC_alvaro_demand_autonomy_tt:0 "Alvaro forces the succession crisis into the open with a formal ultimatum. The Crown's answer to it will be decided in the moment, not by this focus."

 # --- Phase 4: the three culminating focuses ---

 LSC_kael_war_of_inheritance:0 "War of Inheritance"
 LSC_kael_war_of_inheritance_desc:0 "The dossier is written. The capital is held. Kael's people are no longer asking permission for anything — they are simply informing the relevant offices of what has already been decided. All that remains is the occasion."
 LSC_kael_war_of_inheritance_tt:0 "Kael's faction is ready to move on the throne itself. What happens next will be decided by events, not by this focus."

 LSC_selene_the_marble_gambit:0 "The Marble Gambit"
 LSC_selene_the_marble_gambit_desc:0 "Selene has spent her clemency and her contacts in equal measure, and both edges of the crisis now owe her something they would rather not admit to. Whether that debt is enough to hold the realm together is a question she can no longer put off answering."
 LSC_selene_the_marble_gambit_tt:0 "Selene's network is as wide as it will get before the crisis forces her hand. What happens next will be decided by events, not by this focus."

 LSC_alvaro_northern_uprising:0 "The Northern Uprising"
 LSC_alvaro_northern_uprising_desc:0 "The presses do not stop, the rifles do not go back to their hiding places, and the committees no longer pretend to be anything other than what they are. North Alaric has stopped asking Aelia for anything at all."
 LSC_alvaro_northern_uprising_tt:0 "The north stands ready to rise. What happens next will be decided by events, not by this focus."

 # --- Part D: immediate post-war consolidation bridges ---

 LSC_kael_the_black_crown:0 "The Black Crown"
 LSC_kael_the_black_crown_desc:0 "The war is over, but the south has learned what rule by emergency costs. Kael's first task is not to promise renewal, but to make the surviving state answer to one command again."
 LSC_kael_the_black_crown_tt:0 "Completes the initial consolidation of Kael's government and records the opening point for its future political route."

 LSC_alvaro_the_revolution_survives:0 "The Revolution Survives"
 LSC_alvaro_the_revolution_survives_desc:0 "Emporiae has endured the war, but victory has not answered what the new north should become. The committees must now hold together long enough to decide it themselves."
 LSC_alvaro_the_revolution_survives_tt:0 "Completes the initial consolidation of Alvaro's government while preserving the future choice between a broad front and a vanguard."

 LSC_selene_a_crown_of_marble:0 "A Crown of Marble"
 LSC_selene_a_crown_of_marble_desc:0 "Selene has secured the palace by settlement, force, or war. The court is quiet for now; the shape of the order she has saved remains for a later decision."
 LSC_selene_a_crown_of_marble_tt:0 "Completes the initial consolidation of Selene's government and preserves how she reached the throne."

 LSC_a_provisional_settlement:0 "A Provisional Settlement"
 LSC_a_provisional_settlement_desc:0 "Neither camp has won the country it claimed to save. A caretaker government keeps the state standing while the unanswered succession is deferred rather than resolved."
 LSC_a_provisional_settlement_tt:0 "Completes immediate crisis cleanup and records a provisional path for future content."

 # --- Part E1: Kael's Black Crown ---

 LSC_kael_black_coronation:0 "The Black Coronation"
 LSC_kael_black_coronation_desc:0 "Kael's crown is forged into a public answer to civil war: black banners, military oaths, and a throne that now claims it can survive only by making fear into law."
 LSC_kael_a_father_betrayed:0 "A Father Betrayed"
 LSC_kael_a_father_betrayed_desc:0 "Viktor's death is recast as a sacred wound. The court will mourn the father Kael arranged to lose, while the state learns to mourn exactly as it is told."
 LSC_kael_the_alarican_conspiracy:0 "The Alarican Conspiracy"
 LSC_kael_the_alarican_conspiracy_desc:0 "The official story has no room for uncertainty: Alvaro, northern radicals, and every critic of the Crown become parts of one deliberate conspiracy."
 LSC_kael_first_decree:0 "The First Decree of Kael"
 LSC_kael_first_decree_desc:0 "Emergency powers cease to be emergency measures. Ministries, courts, and provincial offices receive a single instruction: the war is over, but the decree remains."
 LSC_kael_restore_authority_in_aelia:0 "Restore Authority in Aelia"
 LSC_kael_restore_authority_in_aelia_desc:0 "The capital must look orderly before it can rule. Clerks return under guard, offices reopen, and the machinery of command begins serving Kael alone."
 LSC_kael_reward_the_victors:0 "Reward the Victors"
 LSC_kael_reward_the_victors_desc:0 "Commissions, contracts, and titles are distributed to the officers and southern families who made the Crown's victory possible. Their loyalty is purchased openly."
 LSC_kael_military_governors:0 "Military Governors of the North"
 LSC_kael_military_governors_desc:0 "North Alaric is divided into commands rather than provinces. Governors answer to Aelia through the Army, not to any local assembly."
 LSC_kael_disarm_the_committees:0 "Disarm the Committees"
 LSC_kael_disarm_the_committees_desc:0 "Weapons caches, meeting halls, and union ledgers are seized in a campaign that treats political organization itself as evidence of rebellion."
 LSC_kael_railways_of_occupation:0 "Railways of Occupation"
 LSC_kael_railways_of_occupation_desc:0 "The northern lines are repaired for troop trains, ore wagons, and inspectors. Their first purpose is not local recovery, but the uninterrupted reach of Aelia."
 LSC_kael_permanent_security_zones:0 "Permanent Security Zones"
 LSC_kael_permanent_security_zones_desc:0 "The regime answers a wounded north with checkpoints, curfews, and jurisdictions from which ordinary law has been removed."
 LSC_kael_penal_colonies_of_blestium:0 "The Penal Colonies of Blestium"
 LSC_kael_penal_colonies_of_blestium_desc:0 "Prisoners, suspects, and families marked by collective punishment are sent to Blestium. The state calls it correction; the people sent there know it as disappearance."
 LSC_kael_extract_by_force:0 "Extract by Force"
 LSC_kael_extract_by_force_desc:0 "Theranda's mines are made to answer production quotas regardless of the bodies required to meet them. The north pays for southern order in ore and human exhaustion."
 LSC_kael_mining_concessions:0 "Mining Concessions"
 LSC_kael_mining_concessions_desc:0 "Southern houses receive guarded rights over northern deposits. Their profit depends on the Army, and the Army's presence becomes the price of every local livelihood."
 LSC_kael_closed_industrial_cities:0 "Closed Industrial Cities"
 LSC_kael_closed_industrial_cities_desc:0 "Selected northern towns are remade into controlled industrial enclaves: employment, housing, and movement depend on a company gate and a military pass."
 LSC_kael_divide_the_northern_workers:0 "Divide the Northern Workers"
 LSC_kael_divide_the_northern_workers_desc:0 "Debt, favored contractors, and carefully rationed privileges turn communities against one another. A divided workforce is easier to exploit and harder to organize."
 LSC_kael_sword_above_the_throne:0 "The Sword Above the Throne"
 LSC_kael_sword_above_the_throne_desc:0 "Kael makes his bargain plain: the Crown commands because the Army permits it, and the Army is rewarded because it makes that command real."
 LSC_kael_general_staff_state:0 "The General Staff State"
 LSC_kael_general_staff_state_desc:0 "Civil administration is subordinated to planning boards and uniformed commands. Kael remains Czar, but the staff becomes the regime's governing spine."
 LSC_kael_crown_oligarch_pact:0 "The Crown-Oligarch Pact"
 LSC_kael_crown_oligarch_pact_desc:0 "The great southern families receive protected contracts and privileged access. In return, their wealth binds itself to Kael's survival."
 LSC_kael_arsenals_of_aelia:0 "The Arsenals of Aelia"
 LSC_kael_arsenals_of_aelia_desc:0 "The capital's workshops are placed under staff control, turning the industrial heart of the south toward the Army's next requirements."
 LSC_kael_southern_arms_contracts:0 "Southern Arms Contracts"
 LSC_kael_southern_arms_contracts_desc:0 "War profits are legalized into permanent arrangements. The Crown gains production; the oligarchs gain a claim on the state that cannot be easily recalled."
 LSC_kael_the_southern_shipyards:0 "The Southern Shipyards"
 LSC_kael_the_southern_shipyards_desc:0 "Ports and dockyards become showcases for a maritime future the regime cannot yet afford to pursue. For now, they demonstrate that the south still owns the coast."
 LSC_kael_the_alvaro_file:0 "The Alvaro File"
 LSC_kael_the_alvaro_file_desc:0 "The regime must decide whether Alvaro is a dead traitor, an enemy still hunted, or a danger too useful to acknowledge publicly."
 LSC_kael_selenes_silence:0 "Selene's Silence"
 LSC_kael_selenes_silence_desc:0 "Selene remains alive because killing a Vorenkov would create a martyr. What Kael requires is not her death, but a future in which she cannot speak freely."
 LSC_kael_one_throne_one_army:0 "One Throne, One Army"
 LSC_kael_one_throne_one_army_desc:0 "The military state is complete: North Alaric is held in chains, rivals are managed as security problems, and every institution now faces the throne through a uniform."
 LSC_kael_empire_of_the_black_crown:0 "Empire of the Black Crown"
 LSC_kael_empire_of_the_black_crown_desc:0 "Kael's order rests on extraction, contracts, and controlled inequality. The north is bound to the south not by reconciliation, but by debt, profit, and force."

 # --- Part E2: Alvaro's Alarican Revolution ---

 LSC_alvaro_from_valleys_to_emporiae:0 "From the Valleys to Emporiae"
 LSC_alvaro_from_valleys_to_emporiae_desc:0 "The committees that endured in the valleys must now govern from Emporiae, where every empty desk is a promise the revolution has made to keep."
 LSC_alvaro_provisional_government:0 "A Provisional Revolutionary Government"
 LSC_alvaro_provisional_government_desc:0 "The first government is deliberately temporary: enough authority to keep the railways open, not enough to decide the revolution before those who made it can speak."
 LSC_alvaro_count_the_martyrs:0 "Count the Martyrs"
 LSC_alvaro_count_the_martyrs_desc:0 "Names, workplaces, villages, and the dead who never made it home are entered into a public ledger. The record does not settle the revolution; it prevents its cost from becoming a slogan."
 LSC_alvaro_empty_offices_of_the_crown:0 "The Empty Offices of the Crown"
 LSC_alvaro_empty_offices_of_the_crown_desc:0 "The emergency councils surrender their wartime powers to clerks, delegates, and local administrations. A revolution still needs someone to answer the post."
 LSC_alvaro_rebuild_north_alaric:0 "Rebuild North Alaric"
 LSC_alvaro_rebuild_north_alaric_desc:0 "Teno, Emporiae, Blestium, Martius, Lemanis, and Theranda all survived differently. Recovery must reach the mines and villages as well as the capital."
 LSC_alvaro_railway_to_theranda:0 "The Railway to Theranda"
 LSC_alvaro_railway_to_theranda_desc:0 "The mountain line moves ore, food, and displaced families again. Its first timetable is written for recovery rather than occupation."
 LSC_alvaro_feed_martius:0 "Feed Martius"
 LSC_alvaro_feed_martius_desc:0 "A city cannot debate its future on an empty stomach. Rationing is imperfect, but unchecked requisition would make the revolution another name for scarcity."
 LSC_alvaro_reopen_teno_port:0 "Reopen the Port of Teno"
 LSC_alvaro_reopen_teno_port_desc:0 "Teno's docks reconnect the north to supplies, repair crews, and a modest commerce no committee can replace by decree."
 LSC_alvaro_local_administrations:0 "Local Administrations"
 LSC_alvaro_local_administrations_desc:0 "Committees become accountable administrations, keeping their local knowledge without leaving every district to improvise alone."
 LSC_alvaro_disarm_the_free_companies:0 "Disarm the Free Companies"
 LSC_alvaro_disarm_the_free_companies_desc:0 "Volunteers who helped win the war are offered papers, work, and a place in civilian life before private rifles turn victory into permanent faction."
 LSC_alvaro_secure_aelia_archives:0 "Secure the Aelia Archives"
 LSC_alvaro_secure_aelia_archives_desc:0 "The ledgers of the old court contain payrolls, police files, and the machinery of a southern order that has not yet agreed to disappear."
 LSC_alvaro_disarm_kaelist_militias:0 "Disarm the Kaelist Militias"
 LSC_alvaro_disarm_kaelist_militias_desc:0 "Not every uniform in the south serves a state. The new government must recover arsenals without treating every southern household as an enemy."
 LSC_alvaro_reclaim_southern_ports:0 "Reclaim the Southern Ports"
 LSC_alvaro_reclaim_southern_ports_desc:0 "The ports that once supplied the Crown are returned to civilian traffic, under watch but not under a new military occupation."
 LSC_alvaro_review_imperial_police:0 "Review the Imperial Police"
 LSC_alvaro_review_imperial_police_desc:0 "Files, informants, and prisons cannot simply be inherited. The revolution must decide what it refuses to become while keeping order in a defeated south."
 LSC_alvaro_the_kael_question:0 "The Kael Question"
 LSC_alvaro_the_kael_question_desc:0 "Kael is missing, not absolved. Whether he is pursued, tried in absence, or left to the record will shape the meaning of victory."
 LSC_alvaro_selenes_testimony:0 "Selene's Testimony"
 LSC_alvaro_selenes_testimony_desc:0 "Selene's exile is neither justice nor a solution. Her account may clarify the past, but accepting it gives a former princess a place in the new order."
 LSC_alvaro_nationalize_the_mines:0 "Nationalize the Mines"
 LSC_alvaro_nationalize_the_mines_desc:0 "The mines that fed the old southern order are placed under public seal. The difficult question is who will direct them after the seal is broken."
 LSC_alvaro_councils_of_the_republic:0 "Councils of the Republic"
 LSC_alvaro_councils_of_the_republic_desc:0 "The revolution's local councils retain a voice in the state. It is slower, more contentious, and less easily commanded from Emporiae."
 LSC_alvaro_autonomy_charter:0 "The Autonomy Charter"
 LSC_alvaro_autonomy_charter_desc:0 "North Alaric receives guarantees the old Czardom never offered: local representation, regional administration, and limits on rule from the capital."
 LSC_alvaro_southern_republicans:0 "The Southern Republicans"
 LSC_alvaro_southern_republicans_desc:0 "Technicians, republicans, and exhausted civil servants are invited into a settlement that asks the south to join rather than merely submit."
 LSC_alvaro_federation_born_in_revolution:0 "A Federation Born in Revolution"
 LSC_alvaro_federation_born_in_revolution_desc:0 "The provisional government gives way to a federation held together by councils, regional guarantees, and a negotiated southern peace."
 LSC_alvaro_party_of_the_revolution:0 "The Party of the Revolution"
 LSC_alvaro_party_of_the_revolution_desc:0 "A single party promises to coordinate recovery where committees disagree. It also makes disagreement a question of discipline."
 LSC_alvaro_subordinate_the_committees:0 "Subordinate the Committees"
 LSC_alvaro_subordinate_the_committees_desc:0 "Local councils remain, but their mandates now run through the party center. Administration becomes faster; autonomy becomes conditional."
 LSC_alvaro_central_production_plan:0 "The Central Production Plan"
 LSC_alvaro_central_production_plan_desc:0 "Mines, transport, and workshops are assigned common quotas so reconstruction can be directed from Emporiae rather than negotiated district by district."
 LSC_alvaro_vanguard_state:0 "The Vanguard State"
 LSC_alvaro_vanguard_state_desc:0 "The revolution ends its provisional phase with a disciplined party state: more capable of mobilization, less willing to leave the future to argument."
