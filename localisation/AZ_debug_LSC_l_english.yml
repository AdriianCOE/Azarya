l_english:
 # TEMPORARY DEBUG HARNESS — DO NOT COMMIT
 # Loc for common/decisions/CZL_civil_war_probe.txt and events/LSC_civil_war_probe.txt.
 # Phase 4.2C: final static hardening pass before Test 1 is run. 6 decisions
 # exactly — 3 rupture, 2 identify/dump, 1 cleanup. Delete this file together
 # with the rest of the Phase 4.2/4.2A/4.2B/4.2C probe harness (including
 # history/units/LSC_debug_probe_oob.txt).

 LSC_debug_civil_war_probe_category:0 "Civil War Probe (DEBUG)"
 LSC_debug_civil_war_probe_category_desc:0 "Temporary runtime probe for start_civil_war. Requires the LSC_debug_civil_war_probe country flag set via console. Not part of any real playthrough."

 LSC_debug_test_1_north_split:0 "[DEBUG] Rupture 1/3: North Alaric split (Kael shape)"
 LSC_debug_test_1_north_split_desc:0 "Greyed out (not hidden) until CZL_alvaro_vorenkov exists in this country. Load a save where Alvaro's route-choice focus has already been completed, or where he is otherwise already recruited — this decision will never recruit him for you."

 LSC_debug_test_2_south_split:0 "[DEBUG] Rupture 2/3: South split (Alvaro shape, inverted)"
 LSC_debug_test_2_south_split_desc:0 "Fixed order: logs CZL's capital, calls set_capital={state=303} on CZL itself (not the dynamic side), logs again, then starts the civil war ceding the 8 south states with rebel capital 335, then logs CZL's final capital and lists rebel candidates for information only (does not flag one — run Identify Rebel for that)."

 LSC_debug_test_3_oob_controlled:0 "[DEBUG] Rupture 3/3: load_oob onto the existing rebel"
 LSC_debug_test_3_oob_controlled_desc:0 "Run this only on a copied save immediately after Test 1 and rebel identification. It tests whether load_oob adds to the rebel's existing forces. It does not start a new war — it only acts on whichever single country is already flagged LSC_debug_dynamic_rebel."

 LSC_debug_identify_rebel:0 "[DEBUG] Identify dynamic rebel country"
 LSC_debug_identify_rebel_desc:0 "Clears any stale mark, counts every country sharing CZL's original_tag, and only flags LSC_debug_dynamic_rebel when exactly one candidate exists. Check game.log for the exact count either way."

 LSC_debug_dump_state_ownership:0 "[DEBUG] Dump state ownership (5 key states)"

 LSC_debug_clear_probe_flags:0 "[DEBUG] Clear probe flags (does NOT undo the war)"
 LSC_debug_clear_probe_flags_desc:0 "This does not restore the pre-war game state. It does not end the war, delete the dynamic country, return states, restore units, restore the navy, restore characters, or restore the capital. Reload a clean save before every split test."

 LSC_civil_war_probe.90.t:0 "[DEBUG] on_civil_war_end fired"
 LSC_civil_war_probe.90.d:0 "Only fires when the probe's global debug flag is active AND a CZL-related war is involved. Expect ROOT=winner, FROM=annexed side per real on_actions comment. Check game.log."
 LSC_civil_war_probe.90.a:0 "OK"

 LSC_civil_war_probe.91.t:0 "[DEBUG] on_civil_war_end_before_annexation fired"
 LSC_civil_war_probe.91.d:0 "Only fires when the probe's global debug flag is active AND a CZL-related war is involved. FROM should still exist at this point. Check game.log."
 LSC_civil_war_probe.91.a:0 "OK"

 LSC_civil_war_probe.92.t:0 "[DEBUG] on_capitulation fired"
 LSC_civil_war_probe.92.d:0 "Only fires when the probe's global debug flag is active AND a CZL-related war is involved. Expect ROOT=capitulated country, FROM=winner — the INVERSE of the other three hooks. Check game.log."
 LSC_civil_war_probe.92.a:0 "OK"

 LSC_civil_war_probe.93.t:0 "[DEBUG] on_annex fired"
 LSC_civil_war_probe.93.d:0 "Only fires when the probe's global debug flag is active AND a CZL-related war is involved. Expect ROOT=winner, FROM=annexed side. Check game.log."
 LSC_civil_war_probe.93.a:0 "OK"
