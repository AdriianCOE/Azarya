l_english:
 # Azarya: LSC_imperial_fracture_category (Czariado de Lesc / CZL). Phase 2 —
 # pre-succession decisions. Category disappears once a route flag is set;
 # see common/decisions/categories/CZL_imperial_fracture_categories.txt.

 LSC_imperial_fracture_category:0 "The Imperial Fracture"
 LSC_imperial_fracture_category_desc:0 "With the succession openly acknowledged, the Crown, the Army, the great southern houses and the Alarican provinces all begin maneuvering before any heir has been chosen. Every decision here is a trade, not a gift — nothing here comes free."

 LSC_reinforce_alarican_garrisons:0 "Reinforce the Alarican Garrisons"
 LSC_reinforce_alarican_garrisons_desc:0 "New columns march north under sealed orders — not to conquer ground already held, but to remind the Alarican provinces exactly whose peace they live under. The general staff approves; the quartermasters do not."
 LSC_reinforce_alarican_garrisons_tt:0 "Strengthens the Army's loyalty to the Crown and checks the momentum of northern radicals, but the visible buildup only confirms what the Alarican provinces already suspect — and the levies pulled south to pay for it are felt immediately."

 LSC_negotiate_southern_industrialists:0 "Negotiate with the Southern Industrialists"
 LSC_negotiate_southern_industrialists_desc:0 "The great houses of the south are always willing to talk — for a price. Tax relief here, a state contract there, and the Crown's coffers can call on their machine shops when it matters most."
 LSC_negotiate_southern_industrialists_tt:0 "Deepens the oligarchy's stake in the Crown and, for a time, speeds industrial construction across the realm, at the cost of political capital and a further tightening of the screws on the north."

 LSC_purge_suspect_officers:0 "Replace the Suspect Officers"
 LSC_purge_suspect_officers_desc:0 "A quiet reshuffling of postings, retirements offered a little too firmly, and a handful of court-martials kept out of the papers. The general staff comes out leaner, and considerably more certain of where its loyalties lie."
 LSC_purge_suspect_officers_tt:0 "Rebuilds confidence in the officer corps and cuts the ground out from under sympathizers of the northern cause, but the disruption costs the army real experience for a time — and this is not a purge that can be repeated casually."

 LSC_accept_gydian_advisors:0 "Receive Gydian Military Advisors"
 LSC_accept_gydian_advisors_desc:0 "A standing offer from Gydian finally receives an answer. Their officers arrive with staff manuals, artillery doctrine, and a great deal of polite interest in how Lesc conducts its own affairs."
 LSC_accept_gydian_advisors_tt:0 "Brings real doctrinal expertise and a burst of army experience, and binds the general staff a little closer to the Crown — but Gydian's foothold in Lesc's own councils grows with it, and the Crown's freedom of maneuver shrinks by exactly that much. This can only be done once."

 LSC_censor_alarican_press:0 "Censor the Alarican Press"
 LSC_censor_alarican_press_desc:0 "Presses are seized, editors questioned, and the handful of Alarican-language papers still in print are reminded, in writing, what they may no longer say. The agitators go quiet — for now."
 LSC_censor_alarican_press_tt:0 "Cuts into revolutionary organizing in the short term and pleases the men who already run the south, but a censored province is not a pacified one, and the resentment it stores up outlasts the silence."

 LSC_fund_selenes_network:0 "Fund the Marble Princess's Network"
 LSC_fund_selenes_network_desc:0 "Selene's correspondence reaches further than most in the palace realize — clerks, chamberlains, and a discreet circle of informants who owe her, quietly, for favors already rendered."
 LSC_fund_selenes_network_tt:0 "Strengthens Selene's own standing at the oligarchy's expense, at the cost of political capital and a court that runs a little more on favors than on merit. It is influence, not command — the network cannot decide the succession on its own."

 LSC_smuggle_arms_to_northern_committees:0 "Turn a Blind Eye to the Valley Smugglers"
 LSC_smuggle_arms_to_northern_committees_desc:0 "Rifles go missing from a supply depot that was never properly inventoried. Everyone from the quartermaster to the regional prefect has a reason not to look too closely — and by the time anyone would, the crates are long gone into the Alarican valleys."
 LSC_smuggle_arms_to_northern_committees_tt:0 "The Crown does not arm the committees — it simply fails, this time, to stop them. Revolutionary strength and northern unrest both grow, and the army's confidence in its own supply discipline takes a visible hit. Only worth attempting once the underground movement already has real momentum."

 LSC_mobilize_kaels_veteran_leagues:0 "Mobilize the Veterans' Leagues"
 LSC_mobilize_kaels_veteran_leagues_desc:0 "Old soldiers' associations and nationalist leagues take to the streets in disciplined columns, banners high, a very public reminder of who still commands the loyalty of Lesc's armed men."
 LSC_mobilize_kaels_veteran_leagues_tt:0 "Rallies the Army's loyalty and war support and unsettles the revolutionary underground, but the marching columns fray civil order a little more each time they're called out."

 LSC_northern_unrest:0 "Alarican Unrest"
 LSC_army_loyalty:0 "Army Loyalty"
 LSC_oligarch_influence:0 "Oligarchic Influence"
 LSC_gydian_influence:0 "Gydian Influence"
 LSC_selene_legitimacy:0 "Selene's Legitimacy"
 LSC_revolutionary_strength:0 "Revolutionary Strength"

 # --- Part D: immediate post-war consolidation ---

 LSC_postwar_category:0 "After the Fracture"
 LSC_postwar_category_desc:0 "The succession crisis has ended, but ministries, depots, railways, and armed men still carry its scars. These are immediate measures of consolidation, not a substitute for the political settlement still to come."

 LSC_postwar_restore_railway_traffic:0 "Restore Civil Administration"
 LSC_postwar_restore_railway_traffic_desc:0 "Reopen the lines, reappoint clerks, and put the movement of grain and dispatches back under a single civil timetable."
 LSC_postwar_restore_railway_traffic_tt:0 "Removes the railway-sabotage marker, grants stability, and gives an additional administrative reserve to Alvaro's government."

 LSC_postwar_reopen_military_depots:0 "Reopen the Military Depots"
 LSC_postwar_reopen_military_depots_desc:0 "The war left rifles behind locked gates and ledgers behind empty desks. Recover what can still serve the state without rebuilding the whole army today."
 LSC_postwar_reopen_military_depots_tt:0 "Adds a small infantry-equipment reserve and stability; Kael's government also gains Army Experience."

 LSC_postwar_demobilize_irregulars:0 "Demobilize the Irregulars"
 LSC_postwar_demobilize_irregulars_desc:0 "Not every wartime volunteer can remain under arms. Offer wages, papers, and a way home before temporary formations become permanent factions."
 LSC_postwar_demobilize_irregulars_tt:0 "Returns manpower, reduces War Support slightly, and grants Selene's government a small stability bonus."

 # --- Part E1: Kael's consolidation decisions ---

 LSC_kael_consolidation_category:0 "The Black Crown Consolidation"
 LSC_kael_consolidation_category_desc:0 "Kael's regime has ended the war, not the conflict beneath it. Each measure strengthens control while leaving a record that North Alaric will not forget."
 LSC_kael_hunt_alarican_cells:0 "Hunt the Alarican Cells"
 LSC_kael_hunt_alarican_cells_desc:0 "Deploy informants and military police against the remnants of the underground. The arrests will weaken the networks and deepen the resentment that created them."
 LSC_kael_secure_northern_railway:0 "Fund the Northern Railway Guard"
 LSC_kael_secure_northern_railway_desc:0 "Pay guards, station agents, and favored local intermediaries to keep the export lines open without turning every rail town into an open battlefield."
 LSC_kael_control_viktors_memory:0 "Control Viktor's Memory"
 LSC_kael_control_viktors_memory_desc:0 "The proof of Viktor's murder must remain useful only to the Crown. Memorials, speeches, and selected documents will turn a dangerous secret into a managed national myth."

 # --- Part E2: Alvaro's reconstruction decisions ---

 LSC_alvaro_reconstruction_category:0 "Revolutionary Reconstruction"
 LSC_alvaro_reconstruction_category_desc:0 "These are finite measures for a government that must rebuild its country without letting every emergency become permanent authority."
 LSC_alvaro_issue_ration_cards:0 "Issue Ration Cards"
 LSC_alvaro_issue_ration_cards_desc:0 "Make scarcity visible, limited, and accountable before private stockpiles and uncontrolled requisitions make it political poison."
 LSC_alvaro_register_committee_clerks:0 "Register the Committee Clerks"
 LSC_alvaro_register_committee_clerks_desc:0 "Give wartime delegates papers, payrolls, and accountable posts so the administration can keep local knowledge without remaining improvised."
 LSC_alvaro_recover_crown_records:0 "Recover Crown Records"
 LSC_alvaro_recover_crown_records_desc:0 "Search the recovered archives for orders, payments, and testimony without pretending that a missing page can be replaced by a convenient answer."
