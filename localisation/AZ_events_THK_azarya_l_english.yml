THK_azarya.1.t:0 "Annual Queen's Speech"
THK_azarya.1.d:0 "serving as both an instrument of royal propaganda and a reflection of the people's concerns. While it publishes official decrees and speeches from the monarchy, whispers of rebellion and dissatisfaction often find their way into its pages. As tensions rise in the kingdom, the Herald's role in shaping public opinion becomes more crucial than ever."
THK_azarya.1.a:0 "We need a replacement fast"

